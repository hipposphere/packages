name: hippo_analysis_plugin
description: Native analyzer rules and quick fixes for Hipposphere Dart workspaces.
version: 0.1.1
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  analysis_server_plugin: ^0.3.25
  analyzer: ^14.6.0
  analyzer_plugin: ^0.14.19

dev_dependencies:
  analyzer_testing: ^0.4.4
  hippo_analysis:
    hosted: https://pub.hippolabs.org
    version: ^0.2.0
  test: ^1.30.0
  test_reflective_loader: ^0.6.0
