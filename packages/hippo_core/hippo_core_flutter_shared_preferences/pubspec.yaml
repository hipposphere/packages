name: hippo_core_flutter_shared_preferences
description: A shared_preferences-backed KeyValueStore adapter for hippo_core.
version: 0.1.0
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.13.0 < 4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  hippo_core:
    hosted: https://pub.hippolabs.org
    version: ^0.1.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
