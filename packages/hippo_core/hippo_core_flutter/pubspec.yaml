name: hippo_core_flutter
description: Flutter bindings and storage implementations for hippo_core primitives.
version: 0.1.5
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.12.0 < 4.0.0"
  flutter: ">=3.44.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.0
  hippo_core:
    hosted: https://pub.hippolabs.org
    version: ^0.1.4
  path_provider: ^2.1.5
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
