name: hippo_core_flutter
description: Flutter bindings and storage implementations for hippo_core primitives.
version: 0.1.12
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.12.0 < 4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  hippo_core:
    hosted: https://pub.hippolabs.org
    version: ^0.1.8
  path_provider: ^2.1.5
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
