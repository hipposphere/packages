name: hippo_core_flutter_secure_storage
description: A flutter_secure_storage-backed KeyValueStore adapter for hippo_core.
version: 0.1.0
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.12.0 < 4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  hippo_core:
    hosted: https://pub.hippolabs.org
    version: ^0.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
