name: hippobase_auth_client
description: Plain Dart HTTP bindings for Hippobase Auth.
version: 0.1.1
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  hippobase_auth_api_contract:
    hosted: "https://pub.hippolabs.org"
    version: ^0.1.1
  hippobase_auth_models:
    hosted: "https://pub.hippolabs.org"
    version: ^0.1.7
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
