name: hippobase_diagnostics_flutter
description: Flutter capture, storage, export, and viewer helpers for Hippobase diagnostics.
version: 0.1.0
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  hippobase_diagnostics:
    hosted: "https://pub.hippolabs.org"
    version: ^0.1.0
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
