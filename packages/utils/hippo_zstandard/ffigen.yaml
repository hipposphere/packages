# yaml-language-server: $schema=https://raw.githubusercontent.com/dart-lang/native/main/pkgs/ffigen/ffigen.schema.json
name: HippoZstandardNativeBindings
description: Generated bindings for the hippo_zstandard Rust ABI.
output: lib/src/native_bindings.g.dart
ffi-native:
  asset-id: package:hippo_zstandard/src/native_bindings.g.dart
headers:
  entry-points:
    - native/include/hippo_zstandard.h
functions:
  include:
    - hippo_zstd_.*
preamble: |
  // Native bindings for hippo_zstandard.
  //
  // AUTO GENERATED FILE, DO NOT EDIT.
  // ignore_for_file: unused_element, unused_field
