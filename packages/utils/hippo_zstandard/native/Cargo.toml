[package]
name = "hippo_zstandard_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
zrip = { version = "0.8.3", default-features = false, features = ["std", "frame"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
