name: auto_updater_windows
description: Windows implementation of the auto_updater plugin.
version: 1.0.2
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    implements: auto_updater
    platforms:
      windows:
        pluginClass: AutoUpdaterWindowsPluginCApi
