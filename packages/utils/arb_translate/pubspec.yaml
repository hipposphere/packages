name: arb_translate
description: >-
  A command-line tool for automatically generating missing translations to ARB
  files using Google Gemini or OpenAI ChatGPT by LeanCode.
version: 1.3.2
publish_to: https://pub.hippolabs.org
resolution: workspace
topics:
  - localization
  - l10n
  - arb
  - ai
  - gemini

executables:
  arb_translate:

environment:
  sdk: ">= 3.11.0 <4.0.0"

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  openai_dart: ^7.0.1
  file: ^7.0.1
  googleai_dart: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.2
  meta: ^1.16.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
