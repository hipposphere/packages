name: auto_updater
description: Automatic updates for Flutter desktop apps using Sparkle, WinSparkle, and signed Linux AppImages.
version: 1.1.0
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

platforms:
  linux:
  macos:
  windows:

topics:
  - auto-updater

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  auto_updater_linux:
    hosted: https://pub.hippolabs.org
    version: ^1.0.0
  auto_updater_macos: 
    hosted: https://pub.hippolabs.org
    version: ^1.0.0
  auto_updater_platform_interface:
    hosted: https://pub.hippolabs.org
    version: ^1.0.0
  auto_updater_windows:
    hosted: https://pub.hippolabs.org
    version: ^1.0.1
  cryptography: ^2.7.0
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  path: ^1.8.3

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.0
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: auto_updater_linux
      macos:
        default_package: auto_updater_macos
      windows:
        default_package: auto_updater_windows
