name: auto_updater
description: This plugin allows Flutter desktop apps to automatically update themselves (based on sparkle and winsparkle).
version: 1.0.1
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

platforms:
  macos:
  windows:

topics:
  - auto-updater

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  auto_updater_macos: 
    hosted: https://pub.hippolabs.org
    version: ^1.0.0
  auto_updater_platform_interface:
    hosted: https://pub.hippolabs.org
    version: ^1.0.0
  auto_updater_windows:
    hosted: https://pub.hippolabs.org
    version: ^1.0.1
  flutter:
    sdk: flutter
  json_annotation: ^4.8.0
  path: ^1.8.3

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.0
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      macos:
        default_package: auto_updater_macos
      windows:
        default_package: auto_updater_windows
