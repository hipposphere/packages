name: observability_query_client
description: Read-only Prometheus, Loki and Tempo query clients over Dart HTTP's transport interface, built on observability_wire.
version: 0.2.1
homepage: https://hippolabs.org
publish_to: "https://pub.hippolabs.org"
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  dart_http_core:
    hosted: https://pub.hippolabs.org
    version: ^0.4.2
  observability_wire:
    hosted: https://pub.hippolabs.org
    version: ^0.1.0

dev_dependencies:
  test: ^1.30.0
