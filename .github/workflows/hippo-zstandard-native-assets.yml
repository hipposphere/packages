name: hippo_zstandard native assets

on:
  workflow_dispatch:

concurrency:
  group: hippo-zstandard-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE: hippo_zstandard
  PACKAGE_DIRECTORY: packages/utils/hippo_zstandard
  ARTIFACT_REPOSITORY: hipposphere/native-artifacts
  RELEASE_BASE_URL: https://github.com/hipposphere/native-artifacts/releases/download

jobs:
  prepare:
    name: Resolve missing artifacts
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      targets: ${{ steps.plan.outputs.targets }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require a native version bump for native changes
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$PACKAGE_DIRECTORY/native/Cargo.toml"
          if ! git cat-file -e "$BEFORE_SHA:$manifest" 2>/dev/null; then
            exit 0
          fi

          if ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
              "$PACKAGE_DIRECTORY/native" \
              "$PACKAGE_DIRECTORY/tool/build_web.dart"; then
            previous_version="$(git show "$BEFORE_SHA:$manifest" | sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n 1)"
            current_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$manifest" | head -n 1)"
            if [[ "$previous_version" == "$current_version" ]]; then
              echo "::error::Native inputs changed without bumping native/Cargo.toml from $current_version."
              exit 1
            fi
          fi

      - name: Resolve native artifact matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          manifest="$PACKAGE_DIRECTORY/native/Cargo.toml"
          toolchain_manifest="$PACKAGE_DIRECTORY/native/rust-toolchain.toml"
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$manifest" | head -n 1)"
          toolchain="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$toolchain_manifest")"
          targets_file="$RUNNER_TEMP/hippo-zstandard-targets.jsonl"
          : > "$targets_file"

          add_target() {
            local name="$1"
            local arch="$2"
            local triple="$3"
            local runner="$4"
            local library="$5"
            local kind="$6"
            local android_abi="${7:-}"
            local artifact="$PACKAGE-$version-$name-$library"
            local base_url="$RELEASE_BASE_URL/${PACKAGE}-native-v${version}"

            if curl --fail --silent --show-error --location --head \
                "$base_url/$artifact" >/dev/null && \
              curl --fail --silent --show-error --location --head \
                "$base_url/$artifact.sha256" >/dev/null; then
              echo "Skipping existing artifact: $artifact"
              return
            fi

            jq -cn \
              --arg name "$name" \
              --arg arch "$arch" \
              --arg triple "$triple" \
              --arg runner "$runner" \
              --arg library "$library" \
              --arg kind "$kind" \
              --arg android_abi "$android_abi" \
              --arg artifact "$artifact" \
              --arg source ".dart_tool/native-assets/$PACKAGE/$triple/release/$library" \
              '{name:$name, arch:$arch, triple:$triple, runner:$runner, library:$library, kind:$kind, android_abi:$android_abi, artifact:$artifact, source:$source}' \
              >> "$targets_file"
          }

          add_target linux-x64 x64 x86_64-unknown-linux-gnu ubuntu-22.04 \
            libhippo_zstandard_native.so cargo
          add_target linux-arm64 arm64 aarch64-unknown-linux-gnu ubuntu-22.04-arm \
            libhippo_zstandard_native.so cargo
          add_target macos-x64 x64 x86_64-apple-darwin macos-15-intel \
            libhippo_zstandard_native.dylib cargo
          add_target macos-arm64 arm64 aarch64-apple-darwin macos-14 \
            libhippo_zstandard_native.dylib cargo
          add_target windows-x64 x64 x86_64-pc-windows-msvc windows-2022 \
            hippo_zstandard_native.dll cargo
          add_target windows-arm64 arm64 aarch64-pc-windows-msvc windows-11-arm \
            hippo_zstandard_native.dll cargo
          add_target android-arm arm armv7-linux-androideabi ubuntu-22.04 \
            libhippo_zstandard_native.so android armeabi-v7a
          add_target android-arm64 arm64 aarch64-linux-android ubuntu-22.04 \
            libhippo_zstandard_native.so android arm64-v8a
          add_target android-x64 x64 x86_64-linux-android ubuntu-22.04 \
            libhippo_zstandard_native.so android x86_64
          add_target ios-device-arm64 arm64 aarch64-apple-ios macos-14 \
            libhippo_zstandard_native.dylib ios
          add_target ios-simulator-arm64 arm64 aarch64-apple-ios-sim macos-14 \
            libhippo_zstandard_native.dylib ios
          add_target ios-simulator-x64 x64 x86_64-apple-ios macos-15-intel \
            libhippo_zstandard_native.dylib ios
          add_target web-wasm wasm wasm32-unknown-unknown ubuntu-22.04 \
            hippo_zstandard_native.wasm wasm

          targets="$(jq -cs '.' "$targets_file")"
          missing_count="$(jq 'length' <<<"$targets")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target.name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.missing_count != '0' }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ needs.prepare.outputs.toolchain }}" \
            --profile minimal \
            --target "${{ matrix.target.triple }}"

      - name: Install Android NDK
        if: ${{ matrix.target.kind == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="27.2.12479018"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" ]]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are both unset."
            exit 1
          fi

          sdkmanager_path="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$android_sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$sdkmanager_path" || ! -x "$sdkmanager_path" ]]; then
            echo "::error::Could not locate sdkmanager below $android_sdk/cmdline-tools."
            exit 1
          fi

          "$sdkmanager_path" "ndk;$ndk_version"
          echo "ANDROID_NDK_HOME=$android_sdk/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Build native library
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.target.triple }}"
          target_name="${{ matrix.target.name }}"

          if [[ "${{ matrix.target.kind }}" == "android" ]]; then
            toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            case "$triple" in
              aarch64-linux-android)
                export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android21-clang"
                ;;
              armv7-linux-androideabi)
                export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$toolchain/armv7a-linux-androideabi21-clang"
                ;;
              x86_64-linux-android)
                export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$toolchain/x86_64-linux-android21-clang"
                ;;
            esac
          fi

          if [[ "$target_name" == macos-* ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.15
          fi
          if [[ "$target_name" == ios-* ]]; then
            export IPHONEOS_DEPLOYMENT_TARGET=13.0
            if [[ "$target_name" == ios-device-* ]]; then
              export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
            else
              export SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
            fi
          fi

          rustup run "${{ needs.prepare.outputs.toolchain }}" cargo build \
            --locked \
            --release \
            --manifest-path "$PACKAGE_DIRECTORY/native/Cargo.toml" \
            --package hippo_zstandard_native \
            --target "$triple" \
            --target-dir ".dart_tool/native-assets/$PACKAGE"

      - name: Stage artifact and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $source = "${{ matrix.target.source }}"
          $name = "${{ matrix.target.artifact }}"
          $destination = Join-Path artifacts $name
          Copy-Item $source $destination
          $hash = (Get-FileHash -Algorithm SHA256 -Path $destination).Hash.ToLowerInvariant()
          "$hash  $name" | Out-File -FilePath "$destination.sha256" -Encoding ascii -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish prebuilt artifacts
    needs:
      - prepare
      - build
    if: ${{ needs.prepare.outputs.missing_count != '0' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.NATIVE_ARTIFACTS_TOKEN }}
          NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add NATIVE_ARTIFACTS_TOKEN as an Actions secret. It needs Contents: write access to $ARTIFACT_REPOSITORY."
            exit 1
          fi

          target_sha="$(
            gh api "repos/$ARTIFACT_REPOSITORY/commits?per_page=1" \
              --jq '.[0].sha' 2>/dev/null || true
          )"
          if [[ -z "$target_sha" ]]; then
            echo "::error::$ARTIFACT_REPOSITORY has no commit. Initialize its default branch before publishing the first release."
            exit 1
          fi

          tag="${PACKAGE}-native-v${NATIVE_VERSION}"
          if ! gh release view "$tag" --repo "$ARTIFACT_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$ARTIFACT_REPOSITORY" \
              --target "$target_sha" \
              --title "$tag" \
              --notes "Precompiled native assets for $PACKAGE native version $NATIVE_VERSION."
          fi

          gh release upload "$tag" artifacts/* \
            --repo "$ARTIFACT_REPOSITORY" \
            --clobber
