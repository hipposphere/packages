name: Release Hippo CLI

on:
  push:
    tags:
      - "hippo-cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional Hippo CLI version. Defaults to packages/hippo_cli/hippo_cli/pubspec.yaml.
        required: false
        default: ""

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.2
  S3_ENDPOINT_URL: https://storage.hippolabs.org
  STORAGE_BUCKET: artifacts
  AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' packages/hippo_cli/hippo_cli/pubspec.yaml)"
          version="${INPUT_VERSION:-$package_version}"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "hippo-cli-v$version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME:-unknown} does not match hippo_cli package version $version."
            exit 1
          fi

          targets="$(jq -cn '
            [
              {
                os: "linux",
                arch: "x64",
                runner: "ubuntu-latest",
                executable: "hippo",
                compile_args: "",
                smoke_test: true,
                archive: ("hippo-cli-" + $version + "-linux-x64.tar.gz")
              },
              {
                os: "linux",
                arch: "arm64",
                runner: "ubuntu-latest",
                executable: "hippo",
                compile_args: "--target-os linux --target-arch arm64",
                smoke_test: false,
                archive: ("hippo-cli-" + $version + "-linux-arm64.tar.gz")
              },
              {
                os: "macos",
                arch: "arm64",
                runner: "macos-14",
                executable: "hippo",
                compile_args: "",
                smoke_test: true,
                archive: ("hippo-cli-" + $version + "-macos-arm64.tar.gz")
              },
              {
                os: "windows",
                arch: "x64",
                runner: "windows-latest",
                executable: "hippo.exe",
                compile_args: "",
                smoke_test: true,
                archive: ("hippo-cli-" + $version + "-windows-x64.zip")
              }
            ]
          ' --arg version "$version")"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target.os }}-${{ matrix.target.arch }}
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "any"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.OS }}-flutter-${{ env.FLUTTER_VERSION }}
          pub-cache-key: ${{ runner.OS }}-pub-${{ env.FLUTTER_VERSION }}

      - name: Resolve workspace
        run: flutter pub get

      - name: Compile Hippo CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          dart compile exe packages/hippo_cli/hippo_cli/bin/hippo.dart \
            ${{ matrix.target.compile_args }} \
            -o "dist/package/${{ matrix.target.executable }}"

      - name: Smoke test binary
        if: ${{ matrix.target.smoke_test }}
        shell: bash
        run: '"dist/package/${{ matrix.target.executable }}" self version >/dev/null'

      - name: Add release metadata
        shell: bash
        run: |
          cp packages/hippo_cli/README.md dist/package/README.md
          printf '%s\n' '${{ needs.prepare.outputs.version }}' > dist/package/VERSION

      - name: Archive Unix artifact
        if: ${{ matrix.target.os != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifacts
          tar -C dist/package -czf "dist/artifacts/${{ matrix.target.archive }}" .

      - name: Archive Windows artifact
        if: ${{ matrix.target.os == 'windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/artifacts | Out-Null
          Compress-Archive -Path dist/package/* -DestinationPath "dist/artifacts/${{ matrix.target.archive }}"

      - name: Checksum artifact
        shell: pwsh
        run: |
          $archive = "${{ matrix.target.archive }}"
          $artifactPath = Join-Path "dist/artifacts" $archive
          $checksumPath = "$artifactPath.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifactPath).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -FilePath $checksumPath -Encoding ascii -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.archive }}
          path: dist/artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to storage.hippolabs.org
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    environment: cli-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: true

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate latest metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          cp tool/install-hippo-cli.sh dist/artifacts/install-hippo-cli.sh
          printf '%s\n' "$VERSION" > dist/artifacts/hippo-cli-latest.txt
          jq -n \
            --arg version "$VERSION" \
            --arg baseUrl "https://storage.hippolabs.org" \
            --argjson targets "$TARGETS" \
            '{
              version: $version,
              baseUrl: $baseUrl,
              artifacts: ($targets | map({
                os,
                arch,
                archive,
                url: ($baseUrl + "/" + .archive),
                checksumUrl: ($baseUrl + "/" + .archive + ".sha256")
              }))
            }' > dist/artifacts/hippo-cli-latest.json

      - name: Publish versioned artifacts
        shell: bash
        run: |
          set -euo pipefail

          put_artifact() {
            local file="$1"
            local key="$2"
            echo "Uploading $key"
            aws s3api put-object \
              --bucket "$STORAGE_BUCKET" \
              --key "$key" \
              --body "$file" \
              --endpoint-url "$S3_ENDPOINT_URL" \
              --acl public-read \
              --cache-control "public, max-age=31536000, immutable" \
              --cli-connect-timeout 30 \
              --cli-read-timeout 120 \
              >/dev/null
          }

          find dist/artifacts -type f \
            ! -name 'hippo-cli-latest.*' \
            ! -name 'install-hippo-cli.sh' \
            -print0 | while IFS= read -r -d '' file; do
              put_artifact "$file" "$(basename "$file")"
            done

      - name: Publish latest metadata
        shell: bash
        run: |
          set -euo pipefail

          put_artifact() {
            local file="$1"
            local key="$2"
            echo "Uploading $key"
            aws s3api put-object \
              --bucket "$STORAGE_BUCKET" \
              --key "$key" \
              --body "$file" \
              --endpoint-url "$S3_ENDPOINT_URL" \
              --acl public-read \
              --cache-control "public, max-age=300" \
              --cli-connect-timeout 30 \
              --cli-read-timeout 120 \
              >/dev/null
          }

          put_artifact dist/artifacts/hippo-cli-latest.txt hippo-cli-latest.txt
          put_artifact dist/artifacts/hippo-cli-latest.json hippo-cli-latest.json
          put_artifact dist/artifacts/install-hippo-cli.sh install-hippo-cli.sh

      - name: Print public URLs
        shell: bash
        run: |
          set -euo pipefail
          find dist/artifacts -type f | sort | while read -r file; do
            name="$(basename "$file")"
            echo "https://storage.hippolabs.org/$name"
          done
