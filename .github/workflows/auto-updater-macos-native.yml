name: macOS updater native tests

on:
  push:
    branches: [main]
    paths:
      - packages/utils/auto_updater_macos/**
      - .github/workflows/auto-updater-macos-native.yml
  pull_request:
    paths:
      - packages/utils/auto_updater_macos/**
      - .github/workflows/auto-updater-macos-native.yml
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: any
          flutter-version: 3.47.0
          cache: true
      - name: Prepare real frameworks
        run: |
          flutter precache --macos
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz --output "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
      - name: Compile and run native regression tests
        run: |
          flutter_binary=$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -path '*/FlutterMacOS.framework/FlutterMacOS' -print -quit)
          test -n "$flutter_binary"
          packages/utils/auto_updater_macos/tool/test_native.sh \
            "$RUNNER_TEMP/sparkle/Sparkle.framework" \
            "$(dirname "$flutter_binary")"
