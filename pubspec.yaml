name: hippo_packages_workspace
description: A Melos workspace for Hipposphere packages.
publish_to: none
homepage: https://hippolabs.org
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"

dev_dependencies:
  hippo_analysis:
    hosted: https://pub.hippolabs.org
    version: ^0.2.0
  melos: ^8.10.0

dependency_overrides:
  hippolabs_native_assets:
    hosted: "https://pub.hippolabs.org"
    version: "0.2.1"
  native_toolchain_rust:
    hosted: "https://pub.hippolabs.org"
    version: "1.1.1"
workspace:
  - packages/*/*
  - packages/*/*/*

melos:
  ide:
    intellij:
      enabled: false
  scripts:
    format:
      run: dart format .
      description: Format all Dart files in the repository
    check-format:
      run: dart format --set-exit-if-changed .
      description: Check if all Dart files are formatted
    analyze:
      run: dart analyze
      description: Run Dart analyzer to check for lint errors
    test:
      run: dart run melos exec --dir-exists=test -- flutter test
      description: Run all tests
    ci:
      run: |
        dart run melos run check-format
        dart run melos run analyze
        dart run melos run test
      description: Check formatting, analyze for lint errors, and run tests
    license-add-headers:
      run: npx -y license-check-and-add add
      description: Add/update license headers across the repo
    license-check-headers:
      run: npx -y license-check-and-add check
      description: Fail if headers are missing
